<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6fb">
  <title>Tempest07 登录</title>
  <style>
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --text: #182033;
  --muted: #7b8497;
  --faint: #9aa4b6;
  --line: #e2e7f0;
  --accent: #5b6cff;
  --accent-2: #43bfcf;
  --red: #d93861;
  --green: #0e9f74;
  --shadow: 0 26px 72px rgba(15,23,42,.14);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background:
    radial-gradient(circle at 88% 3%, rgba(91,108,255,.09), transparent 28rem),
    radial-gradient(circle at 18% 100%, rgba(67,215,232,.07), transparent 30rem),
    linear-gradient(180deg, #f7f8fc, var(--bg));
}

a { color: inherit; }
.shell {
  width: min(1180px, calc(100% - 40px));
  min-height: 100vh;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(380px, .72fr);
  align-items: center;
  gap: 26px;
  padding: 30px 0;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 54px;
  color: #f8fafc;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .06em;
  text-transform: uppercase;
  text-decoration: none;
}

.brand-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(173,184,255,.28);
  border-radius: 11px;
  color: #dfe5ff;
  background: linear-gradient(145deg, rgba(122,137,255,.28), rgba(255,255,255,.07));
  box-shadow: 0 14px 32px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.14);
}

.brand-mark svg { width: 17px; height: 17px; fill: currentColor; }
.intro { position: relative; isolation: isolate; max-width: none; min-height: 650px; overflow: hidden; padding: clamp(30px, 4vw, 52px); border: 1px solid rgba(255,255,255,.09); border-radius: 24px; color: #f8fafc; background: radial-gradient(circle at 74% 30%, rgba(83,101,255,.3), transparent 28%), radial-gradient(circle at 24% 110%, rgba(31,201,216,.13), transparent 32%), linear-gradient(135deg, #0a1021 0%, #111b37 58%, #10172d 100%); box-shadow: 0 30px 70px rgba(15,23,42,.2), inset 0 1px 0 rgba(255,255,255,.08); }
.intro::before { content: ""; position: absolute; z-index: -2; inset: 0; opacity: .2; background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size: 46px 46px; mask-image: linear-gradient(110deg, #000, transparent 78%); }
.intro::after { content: ""; position: absolute; z-index: -1; top: -150px; right: -120px; width: 430px; height: 430px; border: 1px solid rgba(130,148,255,.2); border-radius: 50%; box-shadow: 0 0 80px rgba(91,108,255,.08); }
.kicker {
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: #9da9ff;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .10em;
  text-transform: uppercase;
}
.kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #60e6b1; box-shadow: 0 0 0 5px rgba(96,230,177,.1), 0 0 18px rgba(96,230,177,.55); }

h1 {
  margin: 0;
  max-width: 660px;
  color: #fff;
  font-size: clamp(38px, 4vw, 56px);
  line-height: 1.08;
  letter-spacing: -.045em;
}

.intro-copy {
  margin: 18px 0 0;
  max-width: 560px;
  color: #9aa7c2;
  font-size: 14px;
  line-height: 1.8;
}

.access-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 38px;
}

.access-item {
  min-height: 74px;
  padding: 15px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px;
  background: rgba(255,255,255,.055);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter: blur(10px);
}

.access-item strong {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
}

.access-item span {
  color: #8996b2;
  font-size: 12px;
  line-height: 1.5;
}

.panel {
  width: 100%;
  padding: 30px;
  border: 1px solid rgba(218,224,235,.94);
  border-radius: 20px;
  background: rgba(255,255,255,.95);
  box-shadow: var(--shadow), inset 0 1px 0 #fff;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}

.panel-head h2 {
  margin: 0 0 6px;
  font-size: 21px;
  line-height: 1.25;
}

.panel-head p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.status-pill {
  flex: 0 0 auto;
  padding: 6px 10px;
  border: 1px solid rgba(91,108,255,.18);
  border-radius: 999px;
  color: var(--accent);
  background: rgba(91,108,255,.08);
  font-size: 11px;
  font-weight: 900;
}

.field {
  display: grid;
  gap: 7px;
  margin-top: 14px;
}

.field span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.field input {
  width: 100%;
  height: 48px;
  min-width: 0;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  color: var(--text);
  background: #f9fafc;
  font: 700 16px/1.2 inherit;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent), 0 8px 22px rgba(91,108,255,.055);
  background: #fff;
}

.actions {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.button {
  width: 100%;
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  box-shadow: 0 6px 16px rgba(15,23,42,.045);
  font-weight: 850;
  text-decoration: none;
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}

.button.primary {
  border-color: var(--accent);
  background: linear-gradient(135deg, #6878ff, #4556ea);
  color: #fff;
  box-shadow: 0 12px 26px rgba(91,108,255,.22);
}
.button:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: 0 10px 24px rgba(15,23,42,.08); transform: translateY(-1px); }
.button:focus-visible, .field input:focus-visible, .brand:focus-visible { outline: 2px solid #7b88ff; outline-offset: 3px; }

.button:disabled {
  cursor: not-allowed;
  opacity: .62;
}

.button-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.message {
  min-height: 20px;
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.message.error { color: var(--red); }
.message.success { color: var(--green); }
.session-box {
  display: none;
  gap: 12px;
}

.is-signed-in .login-form { display: none; }
.is-signed-in .session-box { display: grid; }
.signed-card {
  padding: 14px;
  border: 1px solid rgba(4, 120, 87, .20);
  border-radius: 12px;
  background: rgba(4, 120, 87, .08);
}

.signed-card strong { display: block; margin-bottom: 5px; font-size: 14px; }
.signed-card span { color: var(--muted); font-size: 12px; }

@media (max-width: 860px) {
  .shell {
    width: min(100% - 28px, 680px);
    grid-template-columns: 1fr;
    gap: 28px;
    padding: 28px 0 38px;
  }
  .intro { min-height: 0; padding: 30px; }
  .brand { margin-bottom: 30px; }
  h1 { font-size: 36px; }
  .access-list { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 26px; }
  .panel { padding: 20px; }
}

@media (max-width: 480px) {
  .shell { width: min(100% - 24px, 680px); padding-top: 12px; }
  .intro { padding: 24px 20px; border-radius: 18px; }
  .brand { margin-bottom: 22px; }
  h1 { font-size: 31px; }
  .intro-copy { font-size: 13px; }
  .access-list { display: none; }
  .field input { font-size: 16px; }
  .panel-head { display: grid; }
  .status-pill { width: max-content; }
  .button-row { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-label="Tempest07">
      <a class="brand" href="/gateway/">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M13 2 4.5 13h7L11 22l8.5-11h-7z"/></svg></span>
        <span>Tempest07</span>
      </a>
      <p class="kicker">Tempest07</p>
      <h1>欢迎回来。</h1>
      <p class="intro-copy">请登录后进入工作台，继续处理项目中心、主体库和日常工具。</p>
      <div class="access-list">
        <div class="access-item"><strong>项目中心</strong><span>项目录入、主体授信、流程意见和资料库。</span></div>
        <div class="access-item"><strong>主体与授信</strong><span>主体信息、联动分行、评级和批单要素。</span></div>
        <div class="access-item"><strong>交易工具</strong><span>成交文本、Excel 写入、交易记录和复盘。</span></div>
        <div class="access-item"><strong>报告工具</strong><span>周报任务、新闻流和辅助信息入口。</span></div>
      </div>
    </section>

    <section class="panel" id="loginPanel" aria-label="登录">
      <div class="panel-head">
        <div>
          <h2 id="panelTitle">管理员登录</h2>
          <p id="panelCopy">请输入管理员账号，登录后可返回刚才访问的页面。</p>
        </div>
        <span class="status-pill" id="panelState">登录入口</span>
      </div>

      <form class="login-form" id="loginForm" autocomplete="on">
        <label class="field">
          <span>用户名</span>
          <input id="username" name="username" autocomplete="username" value="admin" required>
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入管理员密码" required>
        </label>
        <div class="actions">
          <button class="button primary" id="loginButton" type="submit">登录</button>
          <a class="button" href="/gateway/">返回 Gateway</a>
        </div>
      </form>

      <div class="session-box" id="sessionBox">
        <div class="signed-card">
          <strong id="signedName">欢迎回来，管理员</strong>
          <span>可以继续进入工作台。</span>
        </div>
        <div class="button-row">
          <a class="button primary" id="continueButton" href="/gateway/">继续访问</a>
          <button class="button" id="logoutButton" type="button">退出登录</button>
        </div>
      </div>

      <p class="message" id="message">请输入账号和密码。</p>
    </section>
  </main>

  <script>
const panel = document.querySelector("#loginPanel");
const form = document.querySelector("#loginForm");
const usernameInput = document.querySelector("#username");
const passwordInput = document.querySelector("#password");
const loginButton = document.querySelector("#loginButton");
const logoutButton = document.querySelector("#logoutButton");
const continueButton = document.querySelector("#continueButton");
const panelTitle = document.querySelector("#panelTitle");
const panelCopy = document.querySelector("#panelCopy");
const panelState = document.querySelector("#panelState");
const signedName = document.querySelector("#signedName");
const message = document.querySelector("#message");
const nextPath = safeNext(new URL(location.href).searchParams.get("next")) || "/gateway/";

if (continueButton) continueButton.href = nextPath;

form?.addEventListener("submit", async (event) => {
  event.preventDefault();
  const username = usernameInput?.value.trim() || "admin";
  const password = passwordInput?.value || "";
  if (!username || !password) {
    setMessage("请输入用户名和密码。", "error");
    return;
  }
  setBusy(true);
  setMessage("正在登录...");
  try {
    const response = await fetch("/auth/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || !payload.user) throw new Error(payload.error || `HTTP ${response.status}`);
    passwordInput.value = "";
    applySignedIn(payload.user);
    setMessage(payload.message || "登录成功。", "success");
    location.assign(nextPath);
  } catch (error) {
    applySignedOut();
    setMessage(error.message || "登录失败，请检查密码。", "error");
  } finally {
    setBusy(false);
  }
});

logoutButton?.addEventListener("click", async () => {
  setBusy(true);
  await fetch("/auth/logout", {
    method: "POST",
    credentials: "same-origin",
  }).catch(() => {});
  applySignedOut();
  setMessage("已退出登录。", "success");
  setBusy(false);
});

restoreSession();

async function restoreSession() {
  try {
    const response = await fetch("/auth/session", {
      cache: "no-store",
      credentials: "same-origin",
    });
    if (!response.ok) return applySignedOut();
    const payload = await response.json();
    if (payload.user) {
      applySignedIn(payload.user);
      setMessage("欢迎回来，可以继续访问。", "success");
      return;
    }
  } catch {
    applySignedOut();
  }
  return applySignedOut();
}

function applySignedIn(user) {
  const name = user.nickname || user.username || "管理员";
  panel?.classList.add("is-signed-in");
  if (panelTitle) panelTitle.textContent = `欢迎回来，${name}`;
  if (panelCopy) panelCopy.textContent = "可以继续进入工作台。";
  if (panelState) panelState.textContent = "已登录";
  if (signedName) signedName.textContent = `欢迎回来，${name}`;
}

function applySignedOut() {
  panel?.classList.remove("is-signed-in");
  if (panelTitle) panelTitle.textContent = "管理员登录";
  if (panelCopy) panelCopy.textContent = "请输入管理员账号，登录后可返回刚才访问的页面。";
  if (panelState) panelState.textContent = "登录入口";
}

function setBusy(busy) {
  form?.querySelectorAll("input, button").forEach((element) => {
    element.disabled = Boolean(busy);
  });
  if (logoutButton) logoutButton.disabled = Boolean(busy);
  if (loginButton) loginButton.textContent = busy ? "正在登录..." : "登录";
}

function setMessage(text, type = "") {
  if (!message) return;
  message.textContent = text;
  message.classList.toggle("error", type === "error");
  message.classList.toggle("success", type === "success");
}

function safeNext(value) {
  if (!value || !value.startsWith("/")) return "";
  if (value.startsWith("//")) return "";
  return value;
}
  </script>
</body>
</html>
